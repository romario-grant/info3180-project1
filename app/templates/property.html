{% extends "base.html" %}

{% block main %}
<div class="container mt-5">
    <div class="card shadow-sm border-0 w-100 mb-5">
        <div class="row g-0">
            
            <div class="col-md-4">
                <img src="{{ url_for('static', filename='uploads/' + property.photo) }}" class="img-fluid rounded-start w-100 h-100" style="object-fit: cover;" alt="Property Photo">
            </div>
            
            <div class="col-md-8">
                <div class="card-body p-4 p-md-5">
                    
                    <h4 class="card-title fw-bold mb-3">{{ property.title }}</h4>
                    
                    <div class="mb-4">
                        <span class="badge rounded-pill px-3 py-2 me-2 fs-6" style="background-color: #6ba0fc;">${{ "{:,.0f}".format(property.price) }}</span>
                        <span class="badge bg-warning text-white rounded-pill px-3 py-2 fs-6">{{ property.property_type }}</span>
                    </div>
                    
                    <p class="card-text mb-4" style="line-height: 1.6;">{{ property.description }}</p>
                    
                    <div class="d-flex mb-4 fw-bold text-secondary">
                        <div class="me-4">
                            <i class="bi bi-door-open fs-5 me-2"></i>{{ property.rooms }} Bedrooms
                        </div>
                        <div>
                            <i class="bi bi-droplet fs-5 me-2"></i>{{ property.bathrooms }} Bathrooms
                        </div>
                    </div>
                    
                    <div class="mb-4 fw-bold text-secondary">
                        <i class="bi bi-geo-alt fs-5 me-2"></i>{{ property.location }}
                    </div>
                    
                    <button class="btn text-white px-4 py-2 mt-2" style="background-color: #2ca28f;">Email Realtor</button>
                    
                </div>
            </div>
            
        </div>
    </div>
</div>
{% endblock %}
